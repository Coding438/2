<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal • Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-store"></i>
          <span>ShopAdmin</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-pie"></i><span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="products">
          <i class="fas fa-box"></i><span>Products</span>
        </a>
        <a href="#" class="nav-item" data-page="orders">
          <i class="fas fa-shopping-cart"></i><span>Orders</span>
        </a>
        <a href="#" class="nav-item" data-page="customers">
          <i class="fas fa-users"></i><span>Customers</span>
        </a>
        <a href="#" class="nav-item" data-page="inventory">
          <i class="fas fa-warehouse"></i><span>Inventory</span>
        </a>
        <a href="#" class="nav-item" data-page="analytics">
          <i class="fas fa-chart-line"></i><span>Analytics</span>
        </a>
        <a href="#" class="nav-item" data-page="reviews">
          <i class="fas fa-star"></i><span>Reviews</span>
        </a>
        <a href="#" class="nav-item" data-page="coupons">
          <i class="fas fa-ticket-alt"></i><span>Coupons</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <i class="fas fa-cog"></i><span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar"><i class="fas fa-user-shield"></i></div>
          <div class="user-details">
            <span class="user-name" id="userName">Admin</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobileMenu">
            <i class="fas fa-bars"></i>
          </button>
          <h2 class="page-title" id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-right">
          
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="globalSearch" placeholder="Search..." />
          </div>
          <button class="icon-btn" id="notifBtn" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notifBadge" style="display:none">0</span>
          </button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Pages injected here -->
      </div>
    </main>
  </div>

  <!-- Modals container -->
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
